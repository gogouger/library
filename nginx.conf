server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Resolve the API service at request time. Docker can assign it a new
    # address after a restart, so a startup-only lookup leaves the public
    # shelf pointing at a dead upstream.
    resolver 127.0.0.11 valid=15s;
    resolver_timeout 5s;
    set $books_api http://api:80;

    # Keep crawlers / AI bots out (applies to all responses without their own add_header)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /covers/ {
        alias /data/covers/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $books_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the proxy-authenticated identity (set by Caddy/Authelia)
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Name $http_remote_name;
    }

    location /opds/ {
        proxy_pass $books_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
